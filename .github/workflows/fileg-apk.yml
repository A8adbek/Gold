name: Build FileG APK
on:
  push:
    paths:
      - 'fileG/**'
      - '.github/workflows/fileg-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build FileG arm64 APK
        run: gradle -p fileG --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: FileG-APK
          path: fileG/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Split APK into transfer-sized parts
        run: split -b 24m fileG/app/build/outputs/apk/debug/app-debug.apk /tmp/fileg-apk-part-
      - uses: actions/upload-artifact@v4
        with:
          name: FileG-APK-part-1
          path: /tmp/fileg-apk-part-aa
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: FileG-APK-part-2
          path: /tmp/fileg-apk-part-ab
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: FileG-APK-part-3
          path: /tmp/fileg-apk-part-ac
          if-no-files-found: error
