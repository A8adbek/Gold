name: Publish Tayanch website
on:
  push:
    branches: [main]
    paths:
      - 'tayanch/**'
      - '.github/workflows/tayanch-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: tayanch-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out website
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload only Tayanch public prototype
        uses: actions/upload-pages-artifact@v3
        with:
          path: tayanch
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
